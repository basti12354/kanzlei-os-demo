<text x="62" y="1136" class="body" style="fill:#e0e8f2">Planungsansatz: 16–23 € netto, noch nicht gemessen. API, Auth, Dateien, Test, Logs und Backup inklusive.</text>
<text x="62" y="1162" class="body" style="fill:#e0e8f2">Vor Echtdaten: konkretes Angebot, Kostenlimits / Alarme, Datenschutz- und Betriebsfreigabe.</text>
<text x="62" y="1187" class="small" style="fill:#c3d1e2">Region allein ist keine Datenschutzfreigabe. Anbieterwechsel erfordert einen geprüften Adapter und Datenimport.</text>
