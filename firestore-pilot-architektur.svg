<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250" role="img" aria-labelledby="title desc"><title id="title">Kanzlei OS – Firestore-Pilot</title><desc id="desc">Browser über eigene API mit austauschbaren Adaptern für Anmeldung, Firestore und private Dateien. Getrennte Test- und Produktivsysteme, Audit, Sicherung und neutraler Export mit unabhängigem Importtest. Lokale Funktionen vorhanden, Cloud-Aufbau offen.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#76869b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#24354b}.title{font-size:30px;font-weight:700}.heading{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.label{font-size:12px;font-weight:700;letter-spacing:1px}.edge{fill:none;stroke:#76869b;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1200" height="1250" fill="#f3f6fa"/>
